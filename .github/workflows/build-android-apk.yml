name: Build SleepTransit Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - 'capacitor-app/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Capacitor deps & sync Android
        working-directory: capacitor-app
        run: |
          npm install --no-audit --no-fund
          npx cap sync android

      - name: Build Debug APK
        working-directory: capacitor-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload SleepTransit.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SleepTransit-Android-APK
          path: capacitor-app/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
